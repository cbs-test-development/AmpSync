name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        AmpSync is download-only on purpose: it copies a SharePoint folder to your disk and can be re-run to resume or refresh. Two-way sync is out of scope.

        Please do not include SharePoint links or file names.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation first, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like AmpSync to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
