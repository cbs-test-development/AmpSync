name: Bug report
description: Something did not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Please do not include SharePoint links, site or folder names, file names, cookies or screenshots that show them.**
        The diagnostics text from the app is already cleaned of those. If you need to describe a path, replace the parts that identify your organisation with placeholders.
  - type: input
    id: version
    attributes:
      label: AmpSync version
      description: Shown under About in the app, or run `ampsync --version`.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Ubuntu 24.04
        - Ubuntu 22.04
        - Other Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Which one are you using?
      options:
        - Desktop app (installer)
        - Desktop app (portable .exe)
        - Desktop app (AppImage)
        - Desktop app (.deb)
        - Command line (ampsync)
    validations:
      required: true
  - type: dropdown
    id: signin
    attributes:
      label: How did you sign in?
      options:
        - AmpSync window
        - Edge or Chrome
        - Pasted session
        - Not sure / not relevant
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In the app, open About and choose "Copy diagnostics", then paste it here. For the command line, paste the output of `ampsync --version` and the error message.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed SharePoint links, site and folder names, file names and cookies from everything above.
          required: true
