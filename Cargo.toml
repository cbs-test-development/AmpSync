[workspace]
resolver = "3"
members = [
    "crates/ampsync-core",
    "crates/ampsync-cli",
    "apps/desktop/src-tauri",
]
exclude = ["spikes/probe"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ampsync-core = { path = "crates/ampsync-core" }

async-trait = "0.1"
base64 = "0.23"
bytes = "1"
directories = "6"
futures = "0.3"
globset = "0.4"
keyring = "4"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "stream", "http2"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "signal"] }
toml = "1"
tracing = "0.1"
url = { version = "2", features = ["serde"] }
