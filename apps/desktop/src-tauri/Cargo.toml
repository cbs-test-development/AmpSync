[package]
name = "ampsync-desktop"
description = "AmpSync desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
publish = false

[lib]
name = "ampsync_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ampsync-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

[dependencies]
ampsync-core = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
# `net`: the browser link's named pipe / unix socket (the workspace default leaves it out).
tokio = { workspace = true, features = ["net"] }
futures = { workspace = true }
time = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
directories = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
percent-encoding = { workspace = true }
tauri-plugin-notification = "2"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
winreg = "0.56"
# Raw bindings for the current user's SID and the pipe's security descriptor (browser link).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }
tauri-winrt-notification = "0.8"
